<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla de Pago</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="https://js.stripe.com/v3/"></script>
</head>
<body class="payment-body">
<div class="payment-container">

    <div class="card payment-method">
        <h2 class="card-title">Selecciona tu método de pago</h2>
        <div class="payment-option">
            <input type="radio" id="efectivo" name="payment" value="efectivo">
            <label for="efectivo">Efectivo</label>
        </div>
        <div class="payment-option">
            <input type="radio" id="tarjeta" name="payment" value="tarjeta" checked>
            <label for="tarjeta">Tarjeta de débito/crédito</label>
        </div>
    </div>

    <div class="card delivery-address">
        <h2 class="card-title">Dirección de entrega</h2>
        <div class="form-group">
            <input id="dir-calle" type="text" placeholder="Calle">
        </div>
        <div class="form-group">
            <input id="dir-numero" type="text" placeholder="N° de casa/apartamento">
        </div>
        <div class="form-group">
            <input id="dir-barrio" type="text" placeholder="Barrio">
        </div>
        <div class="form-group">
            <input id="dir-adicional" type="text" placeholder="Información adicional">
        </div>
    </div>

    <div class="card billing-details">
        <h2 class="card-title">Detalles de facturación</h2>
        <div id="card-element"></div>
        <div id="card-errors"></div>
    </div>

    <div class="card order-summary">
        <div class="summary-item">
            <span>Subtotal</span>
            <span id="display-subtotal">$0</span>
        </div>
        <div class="summary-item">
            <span>Envío</span>
            <span>$0</span>
        </div>
        <div class="summary-item">
            <span>Impuestos</span>
            <span>$0</span>
        </div>
        <div class="summary-divider"></div>
        <div class="summary-total">
            <span>Total</span>
            <span id="display-total">$0</span>
        </div>
        <button id="btn-pagar" class="pay-button" onclick="procesarPago()" type="button">
            Pagar Ahora
        </button>
        <p id="card-errors-general" style="color:#c0392b;font-size:0.9rem;margin-top:0.5rem;"></p>
    </div>

</div>
<script src="./js/scripts.js"></script>
</body>
</html>
